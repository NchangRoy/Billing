databaseChangeLog:
  - changeSet:
      id: 1-create-subscriptions-table
      author: dev
      comments: >
        One subscription per organization, created the first time a Try-Out
        account with no existing seller picks a plan (see AuthUseCaseImpl's
        ensureSellerProvisioned). duration_left is computed on read from
        started_at + duration_days rather than stored, so it can't go stale.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: subscriptions
      changes:
        - createTable:
            tableName: subscriptions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: subscriptions_organization_id_key
              - column:
                  name: type
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: duration_days
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
